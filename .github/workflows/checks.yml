# fts-extensions — the one PR/push gate.
#
# Compile + test only. The REAPER integration suite lives in
# reaper.yml, which is dispatch/tag triggered and must run self-hosted
# (REAPER's licence forbids redistribution).

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_DEV: nix develop --accept-flake-config .#ci -c

jobs:
  check:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h / | tail -1
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-on-failure: "true"
      - name: Manifests + lockfile
        run: ${NIX_DEV} cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo fmt --check
        run: ${NIX_DEV} cargo fmt --all --check
      - name: cargo check --workspace
        run: ${NIX_DEV} cargo check --workspace
      - name: cargo nextest
        run: ${NIX_DEV} cargo nextest run --workspace --no-fail-fast

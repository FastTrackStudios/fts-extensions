# fts-extensions — DAW-host extension cdylibs.
#
# One shared library per host (`apps/extensions/<host>-fts-extensions`);
# REAPER is the first host. Split out of the FastTrackStudio shell in
# August 2026 because this is a product with its own domain logic --
# tempo-grid editing, transient snapping, the volume balancer, mirroring
# -- not the registration glue its size suggests.
#
# The DAW platform it binds lives in the `daw` repo; Signal reaches
# REAPER as a CLAP plugin rather than through this extension.

[workspace]
resolver = "3"

members = [
    "apps/extensions/reaper-fts-extensions",
    "apps/extensions/reaper-fts-extensions/actions",
    "apps/extensions/reaper-fts-extensions/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/fts-extensions"

[workspace.dependencies]
daw = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
daw-actions = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
daw-synchronization = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
daw-reaper = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2", default-features = false }
daw-extension-runtime = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
reaper-config = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
reaper-input = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2", default-features = false }
fts-launcher = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
fts-extensions-actions = { path = "apps/extensions/reaper-fts-extensions/actions" }
session = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2" }
keyflow-orchestra = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2" }
expression-editor-core = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
expression-editor-daw = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
expression-editor-reaper = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
expression-editor-ui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.2" }
architect = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.0.2" }
architect-ui = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.0.2" }
dynamic-template = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2" }
reaper-low = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
eyre = "0.6"
fragile = "2"

[workspace.lints.rust]
# Flipped from "allow" 2026-07-28 (task cleanup): the blanket allows are
# WHY ~30k lines of dead code accumulated silently. The task tree is
# warning-clean under these; legacy crates in other domains carry a
# crate-level `#![allow(dead_code, unused)]` marked "Lint debt" until
# their own burn-down.
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
type_complexity = "allow"
# from the dissolved daw workspace
manual_clamp = "allow"
needless_range_loop = "allow"
not_unsafe_ptr_arg_deref = "allow"
only_used_in_recursion = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
# from the dissolved session workspace
manual_c_str_literals = "allow"
branches_sharing_code = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
collapsible_if = "allow"
map_clone = "allow"
unnecessary_map_or = "allow"
if_same_then_else = "allow"
redundant_locals = "allow"
# from the dissolved keyflow workspace
large_enum_variant = "allow"
explicit_counter_loop = "allow"
manual_strip = "allow"
too_many_arguments = "allow"
double_must_use = "allow"
vec_init_then_push = "allow"
collapsible_match = "allow"
filter_next = "allow"

# ── Dev profile (carried from the dissolved signal workspace) ──────────
# The live rig runs from `fasttrackstudio --engine` (formerly signal-engine/signal-rigd): the vendored NAM C++
# core and the DSP crates are unusable at opt-level 0 (~10-50x slower,
# xruns), so dependencies build at release opt in dev while the thin
# app/UI workspace crates stay at light opt for fast rebuilds.

[profile.dev]
opt-level = 1

# Debuginfo discipline. Full DWARF was the single biggest cost in this
# tree: a `debug` test binary measured 1.62 GB, of which 1.59 GB (98%)
# was `.debug_*` sections — and the default linker copies all of it into
# every binary, every relink. Across ~6 worktrees that was ~1 TB of
# target/ and minutes of link time per build.
#
#   line-tables-only  keeps file:line in backtraces + profiler symbols
#                     (samply/perf still work); drops variable/type DWARF,
#                     so a *debugger* can't inspect locals.
#   unpacked          leaves the remaining DWARF in the .o files under
#                     deps/ instead of copying it into each artifact, so
#                     linking stops moving gigabytes around.
#
# Need a real debugger session? Build with `--profile dev-dbg` (below) —
# same codegen, full DWARF, and it uses a separate target dir so it never
# invalidates the fast dev artifacts.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Escape hatch: full DWARF for stepping in gdb/lldb. Everything else is
# identical to dev, so package opt-level overrides below still apply.
[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

# dx web builds: native debuginfo in the wasm module blew past
# Chrome's 1 GiB WebAssembly module cap (1.14 GB observed). Wasm dev
# builds don't need it — strip it and dev bundles come back to a
# loadable size.

[profile.dev.package."*"]
opt-level = 1

# Audio-thread dependencies, kept at 3. `package."*"` above would
# otherwise drop these to 1, and a dev run of the rig would start
# xrunning. Sourced from `cargo tree` over audiocore-dsp /
# daw-audio-graph / signal-sampler / neural-amp-modeler / eq-dsp /
# pitch-dsp, keeping the crates that do real per-sample or per-block
# work (resampling, decode, FFT, sample-pack decompression, JIT).
#
# If a dev run ever xruns on a path not covered here: run it --release
# (the launch paths already do), or add the crate to this list.

[package]
name = "fts-extensions"
version.workspace = true
edition.workspace = true
description = "FTS Extensions — standalone REAPER extension providing utility actions (cdylib)"

[lib]
# `rlib` alongside the cdylib so integration tests can link the crate and
# call `register_all_architect_actions` directly (tests/action_ids.rs).
# REAPER still loads the cdylib; the rlib is build-time only.
crate-type = ["cdylib", "rlib"]
name = "reaper_fts_extensions"
path = "src/lib.rs"

[features]
# Subsystems confirmed good through bisection. Add more as they're verified.
default = [
    "host-hooks",
    "mod-session",
    "mod-input",
    "mod-launcher",
    "poll-broadcast",
    "ui-dock",
]

# Modules — each implements daw::DawModule.
# `mod-launcher` requires `ui-dock` because its actions toggle a Dioxus
# panel via `daw::ui::dock::toggle_panel`, which is a no-op unless the
# host has called `init_dock`/`init_service` at startup.
mod-launcher = ["dep:fts-launcher", "ui-dock"]
mod-session = ["dep:session", "dep:dynamic-template"]
mod-sync = ["dep:daw-synchronization"]
mod-input = ["dep:reaper-input"]
# Live MIDI mirror: source-of-truth tracks with hidden, library-timing-
# adjusted twins regenerated on edit (keyflow-orchestra mirror pass).
# Off by default — kept as the fallback path for third-party samplers
# while the signal-sampler document-mode lookahead design supersedes it.
mod-mirror = ["dep:keyflow-orchestra"]

# Dioxus dock host (panels, ui_test_panel, dock_state restore, update_panels tick)
ui-dock = ["daw/reaper-ui"]

# Per-frame DAW state polling + broadcast (items, tempo, transport, markers, regions, tracks)
poll-broadcast = []

# FastTrackStudio extensions menu hook + REAPER project importer registration
host-hooks = []

[dependencies]
# architect::action — declarative action metadata (description/category/
# group) + backend-agnostic registration, replacing actions-proto.
architect.workspace = true
# This crate's own #[architect::actions] trait *declarations* (pure
# metadata, no REAPER deps) — split out so fts-cli's generated action
# menu can depend on them without pulling in the full REAPER binding
# stack this crate carries. See its own crate doc for why.
fts-extensions-actions = { workspace = true }

# FTS Launcher — search/workflow engine
fts-launcher = { workspace = true, optional = true }

# Modules — each implements daw::DawModule
session = { workspace = true, optional = true }
# Registered directly (not just via session) so the visibility-manager /
# template / auto-color actions land in REAPER's action list, and so the
# mode bridge can call the per-mode visibility entry point without going
# through the action registry.
dynamic-template = { workspace = true, optional = true }
# The workspace declaration carries `default-features = false`: it disables
# `overlay-prewarm` so reaper-input doesn't try to allocate wgpu/Vello
# surfaces during plugin_main, where the REAPER host window isn't ready
# yet and surface creation OOMs.
reaper-input = { workspace = true, optional = true }
daw-synchronization = { workspace = true, optional = true }
# Orchestral mirror pass (pure Rust, no Reaper deps) — in-tree crate.
keyflow-orchestra = { workspace = true, optional = true }

# DAW API. `reaper-ui` pulls in the Dioxus panel rendering host and is gated
# behind the `ui-dock` feature. `daw-extension-runtime` is a public sibling
# of daw (not a daw feature) because folding it in would cycle through
# daw-reaper.
daw = { workspace = true, features = ["reaper"] }
daw-reaper.workspace = true
daw-actions.workspace = true
daw-extension-runtime = { workspace = true }

# Typed parser/serializer for `reaper-menu.ini`. Used by `mode_toolbars`
# to rename floating toolbars 1..24 to `<Mode> <slot>` at startup.
reaper-config = { workspace = true }

# FTS design system (shadcn-ui clone for Dioxus)
fts-ui = { workspace = true }

# REAPER entry point machinery
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true
reaper-macros.workspace = true

# Async runtime + task dispatch
tokio.workspace = true
crossbeam-channel.workspace = true
fragile.workspace = true
eyre.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
daw = { workspace = true, features = ["reaper", "test-harness"] }
eyre.workspace = true
tokio = { workspace = true, features = ["macros"] }
# Integration tests assert against the canonical ruler-lane layout
# (session::ruler_lanes::CoreLane) instead of magic lane numbers.
session.workspace = true

[lints]
workspace = true

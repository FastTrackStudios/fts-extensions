[package]
name = "fts-extensions-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REAPER integration-test runner for fts-extensions (daw::test harness); invoked via `just reaper-integration-test`"

[[bin]]
name = "fts-extensions-xtask"
path = "src/main.rs"

[dependencies]
# Test-runner orchestration lives at `daw::test::runner` behind the
# `test-harness` feature (former `reaper-test` crate with its `runner`
# feature).
daw = { workspace = true, features = ["test-harness"] }

[lints]
workspace = true
